<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
    <title id="title">GPU-ready compute and persistent model storage</title>
    <desc id="desc">A regional AMI supplies the drivers and Docker GPU runtime; EBS preserves containers and models.</desc>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
      <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
      <marker id="arrow-gray-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="#64748b"/></marker>
    </defs>
    <rect width="1200" height="600" fill="#f8fafc"/>
    <circle cx="72" cy="65" r="28" fill="#f97316"/>
    <text x="72" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">04</text>
    <text x="118" y="59" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="700" fill="#0f172a">GPU-ready compute and persistent model storage</text>
    <text x="118" y="87" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b">A regional AMI supplies the drivers and Docker GPU runtime; EBS preserves containers and models.</text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
      
      <g>
        <rect x="365" y="155" width="500" height="350" rx="18" fill="#fff7ed" fill-opacity="0.46" stroke="#f97316" stroke-width="2" stroke-dasharray="8 7"/>
        <text x="387" y="187" font-size="14" font-weight="700" fill="#334155">EC2 GPU instance</text>
      </g>
      <line x1="170" y1="230" x2="170" y2="405" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="170" y="307.5" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">resolves</text><line x1="170" y1="405" x2="535" y2="267.5" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="352.5" y="326.25" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">launches</text><line x1="535" y1="267.5" x2="732.5" y2="267.5" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="535" y1="267.5" x2="1035" y2="297.5" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="785" y="272.5" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">persists</text><line x1="1035" y1="440" x2="535" y2="267.5" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-gray)"/><text x="785" y="343.75" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">parameter</text>
      
      <g filter="url(#shadow)">
        <rect x="45" y="180" width="250" height="100" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <text x="170" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Public SSM parameter</text>
        <text x="170" y="250" text-anchor="middle" font-size="12" fill="#64748b">Latest regional GPU AMI</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="45" y="355" width="250" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="170" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Amazon Linux GPU AMI</text>
        <text x="170" y="425" text-anchor="middle" font-size="12" fill="#64748b">NVIDIA + Docker runtime</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="440" y="220" width="190" height="95" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="535" y="260.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">g4dn.xlarge</text>
        <text x="535" y="287.5" text-anchor="middle" font-size="12" fill="#64748b">T4 GPU • 16 GiB VRAM</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="655" y="220" width="155" height="95" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="732.5" y="260.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Docker</text>
        <text x="732.5" y="287.5" text-anchor="middle" font-size="12" fill="#64748b">GPU runtime</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="500" y="375" width="240" height="76" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
        <text x="620" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">IMDSv2 required</text>
        <text x="620" y="433" text-anchor="middle" font-size="12" fill="#64748b">Hardened instance metadata</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="930" y="245" width="210" height="105" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <text x="1035" y="290.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Encrypted gp3 EBS</text>
        <text x="1035" y="317.5" text-anchor="middle" font-size="12" fill="#64748b">100 GiB model cache</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="910" y="405" width="250" height="70" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <text x="1035" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Scale when needed</text>
        <text x="1035" y="460" text-anchor="middle" font-size="12" fill="#64748b">g5 • g6 • g6e</text>
      </g>
    </g>
  </svg>