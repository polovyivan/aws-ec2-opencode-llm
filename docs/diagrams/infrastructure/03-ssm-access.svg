<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
    <title id="title">Private administration through AWS Systems Manager</title>
    <desc id="desc">Session Manager replaces an SSH key and inbound port with an authenticated, encrypted session.</desc>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
      <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
      <marker id="arrow-gray-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="#64748b"/></marker>
    </defs>
    <rect width="1200" height="600" fill="#f8fafc"/>
    <circle cx="72" cy="65" r="28" fill="#f97316"/>
    <text x="72" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">03</text>
    <text x="118" y="59" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Private administration through AWS Systems Manager</text>
    <text x="118" y="87" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b">Session Manager replaces an SSH key and inbound port with an authenticated, encrypted session.</text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
      
      <g>
        <rect x="780" y="155" width="350" height="350" rx="18" fill="#fff7ed" fill-opacity="0.46" stroke="#f97316" stroke-width="2" stroke-dasharray="8 7"/>
        <text x="802" y="187" font-size="14" font-weight="700" fill="#334155">EC2 GPU instance</text>
      </g>
      <line x1="165" y1="300" x2="470" y2="300" stroke="#64748b" stroke-width="2.5" marker-start="url(#arrow-gray-start)" marker-end="url(#arrow-gray)"/><text x="317.5" y="290" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">authenticated session</text><line x1="470" y1="300" x2="955" y2="295" stroke="#64748b" stroke-width="2.5" marker-start="url(#arrow-gray-start)" marker-end="url(#arrow-gray)"/><text x="712.5" y="287.5" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">TLS</text><line x1="740" y1="204" x2="955" y2="295" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-gray)"/><text x="847.5" y="239.5" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">authorizes</text><line x1="955" y1="295" x2="955" y2="421" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
      
      <g filter="url(#shadow)">
        <rect x="55" y="250" width="220" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="165" y="293" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Local computer</text>
        <text x="165" y="320" text-anchor="middle" font-size="12" fill="#64748b">AWS CLI + SSM plugin</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="355" y="250" width="230" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="470" y="293" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Systems Manager</text>
        <text x="470" y="320" text-anchor="middle" font-size="12" fill="#64748b">Session control plane</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="640" y="160" width="200" height="88" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
        <text x="740" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">IAM role</text>
        <text x="740" y="224" text-anchor="middle" font-size="12" fill="#64748b">ManagedInstanceCore</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="855" y="245" width="200" height="100" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
        <text x="955" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SSM Agent</text>
        <text x="955" y="315" text-anchor="middle" font-size="12" fill="#64748b">Initiates outbound connection</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="855" y="385" width="200" height="72" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <text x="955" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Shell or port forward</text>
        <text x="955" y="441" text-anchor="middle" font-size="12" fill="#64748b">No public listener</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="350" y="415" width="240" height="66" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <text x="470" y="441" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">No key pair required</text>
        <text x="470" y="468" text-anchor="middle" font-size="12" fill="#64748b">Port 22 remains closed</text>
      </g>
    </g>
  </svg>