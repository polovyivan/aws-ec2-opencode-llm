<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
    <title id="title">Minimal host bootstrap</title>
    <desc id="desc">User data prepares and verifies the host; application installation remains a separate step.</desc>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
      <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
      <marker id="arrow-gray-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="#64748b"/></marker>
    </defs>
    <rect width="1200" height="600" fill="#f8fafc"/>
    <circle cx="72" cy="65" r="28" fill="#f97316"/>
    <text x="72" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">05</text>
    <text x="118" y="59" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Minimal host bootstrap</text>
    <text x="118" y="87" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b">User data prepares and verifies the host; application installation remains a separate step.</text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
      
      <line x1="140" y1="292.5" x2="380" y2="204" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="140" y1="292.5" x2="380" y2="394" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="380" y1="204" x2="640" y2="204" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="380" y1="394" x2="640" y2="394" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="640" y1="204" x2="962.5" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="640" y1="394" x2="962.5" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="962.5" y1="300" x2="962.5" y2="455" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-gray)"/>
      
      <g filter="url(#shadow)">
        <rect x="45" y="240" width="190" height="105" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="140" y="285.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">EC2 user data</text>
        <text x="140" y="312.5" text-anchor="middle" font-size="12" fill="#64748b">Runs once at first boot</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="290" y="160" width="180" height="88" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
        <text x="380" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Enable SSM Agent</text>
        <text x="380" y="224" text-anchor="middle" font-size="12" fill="#64748b">Remote access</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="290" y="350" width="180" height="88" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="380" y="387" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Docker + Compose</text>
        <text x="380" y="414" text-anchor="middle" font-size="12" fill="#64748b">Container tools</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="535" y="160" width="210" height="88" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <text x="640" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Create work directory</text>
        <text x="640" y="224" text-anchor="middle" font-size="12" fill="#64748b">/opt/opencode-llm</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="535" y="350" width="210" height="88" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <text x="640" y="387" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Run nvidia-smi</text>
        <text x="640" y="414" text-anchor="middle" font-size="12" fill="#64748b">Verify GPU and driver</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="835" y="245" width="255" height="110" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
        <text x="962.5" y="293" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Infrastructure ready</text>
        <text x="962.5" y="320" text-anchor="middle" font-size="12" fill="#64748b">Docker + GPU + SSM verified</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="825" y="420" width="275" height="70" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="962.5" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Next chapter</text>
        <text x="962.5" y="475" text-anchor="middle" font-size="12" fill="#64748b">Compose + Ollama + coding model</text>
      </g>
    </g>
  </svg>
