<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
    <title id="title">Network boundary: outbound access without public services</title>
    <desc id="desc">The instance can download containers and models, but the security group exposes no inbound ports.</desc>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
      <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
      <marker id="arrow-gray-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="#64748b"/></marker>
    </defs>
    <rect width="1200" height="600" fill="#f8fafc"/>
    <circle cx="72" cy="65" r="28" fill="#f97316"/>
    <text x="72" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">02</text>
    <text x="118" y="59" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Network boundary: outbound access without public services</text>
    <text x="118" y="87" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b">The instance can download containers and models, but the security group exposes no inbound ports.</text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
      
      <g>
        <rect x="350" y="135" width="780" height="390" rx="18" fill="#f8fafc" fill-opacity="0.46" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
        <text x="372" y="167" font-size="14" font-weight="700" fill="#334155">VPC  10.42.0.0/16</text>
      </g>
      <g>
        <rect x="450" y="205" width="590" height="250" rx="18" fill="#ecfdf5" fill-opacity="0.46" stroke="#059669" stroke-width="2" stroke-dasharray="8 7"/>
        <text x="472" y="237" font-size="14" font-weight="700" fill="#334155">Public subnet  10.42.1.0/24</text>
      </g>
      <line x1="995" y1="315" x2="785" y2="315" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="890" y="305" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">outbound</text><line x1="785" y1="315" x2="575" y2="315" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="575" y1="315" x2="340" y2="305" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="340" y1="305" x2="135" y2="305" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/><line x1="135" y1="305" x2="215" y2="441" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-gray)"/>
      
      <g filter="url(#shadow)">
        <rect x="45" y="260" width="180" height="90" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <text x="135" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Internet</text>
        <text x="135" y="325" text-anchor="middle" font-size="12" fill="#64748b">Registries and model library</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="265" y="260" width="150" height="90" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="340" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Internet gateway</text>
        <text x="340" y="325" text-anchor="middle" font-size="12" fill="#64748b">VPC route target</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="490" y="275" width="170" height="80" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="575" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Route table</text>
        <text x="575" y="335" text-anchor="middle" font-size="12" fill="#64748b">0.0.0.0/0 → IGW</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="700" y="265" width="170" height="100" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
        <text x="785" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Security group</text>
        <text x="785" y="335" text-anchor="middle" font-size="12" fill="#64748b">No inbound rules</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="910" y="265" width="170" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="995" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">EC2 GPU</text>
        <text x="995" y="335" text-anchor="middle" font-size="12" fill="#64748b">Public IP for egress</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="80" y="410" width="270" height="62" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
        <text x="215" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Inbound traffic blocked</text>
        <text x="215" y="461" text-anchor="middle" font-size="12" fill="#64748b">No SSH :22 or Ollama :11434</text>
      </g>
    </g>
  </svg>